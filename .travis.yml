language: php

php:
  - 7.0
  - 7.1
  - 7.2
  - nightly

before_script:
  - travis_retry composer self-update
  - travis_retry composer install --no-interaction --prefer-source --dev
script:
  - php bin/tester

after_script:
  - php vendor/bin/ocular code-coverage:upload --format=php-clover coverage.clover
